<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ClujPulse — Unofficial Festival Schedule Companion</title>
    <meta name="description" content="Fan-made schedule companion for music festivals in Cluj-Napoca. Browse artists, build your lineup, detect clashes. Works offline — no signal needed." />
    <meta name="keywords" content="Cluj-Napoca, festival schedule, lineup builder, timetable, EDM, electronic music, Romania festival" />
    <link rel="canonical" href="https://clujpulse.vercel.app" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clujpulse.vercel.app" />
    <meta property="og:title" content="ClujPulse — Unofficial Festival Lineup Builder" />
    <meta property="og:description" content="Fan-made companion app. Browse 300+ artists, build your lineup, spot clashes. Works offline at the festival." />
    <meta property="og:site_name" content="ClujPulse" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClujPulse — Unofficial Festival Lineup Builder" />
    <meta name="twitter:description" content="Fan-made companion. 300+ artists, clash detection, lock screen export. Works offline." />

    <!-- PWA -->
    <meta name="theme-color" content="#0f0d19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClujPulse" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Geist:wght@300..500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ClujPulse",
      "url": "https://clujpulse.vercel.app",
      "description": "Unofficial, fan-made festival schedule companion. Not affiliated with or endorsed by any festival organizer.",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
